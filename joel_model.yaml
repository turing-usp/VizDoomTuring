name: "joel"

colorset: 3
stack_frames: 4

render_settings:
  resolution: "RES_120X90"
  format: "GRAY8"
  hud: true
  weapon: true
  crosshair: true
  enemy_outline: true
  enemy_outline_value: 255
  enemy_outline_thickness: 2
  enemy_outline_pattern: "checker"

reward:
  engine:
    living_reward: 0.0
    frag_reward: 0.0
    hit_reward: 0.0
    hit_taken_reward: 0.0
    damage_made_reward: 0.0
    damage_taken_penalty: 0.0
    item_reward: 0.0
    health_reward: 0.0
    armor_reward: 0.0
    secret_reward: 0.0

  shaping:
    # combate. pune MUITO a morte e dano, a ideia é que ele seja mais defensivo
    w_frag: 2.5
    w_damage_made: 0.07
    w_hits: 0.18
    w_hits_taken: -0.55
    w_deaths: -16.0

    # sobrevivência / recursos
    w_health: 0.16
    w_armor: 0.10
    w_ammo2_cost: -0.03
    # comportamento
    step_penalty: -0.004
    wall_stuck_penalty: -0.35
    enemy_in_view_reward: 0.01

    # movimento mais cauteloso
    w_speed: 0.002
    idle_speed_threshold: 0.04
    idle_penalty: -0.002

    include_engine_reward: false

  wall_stuck:
    min_move: 1.0
    max_turn_deg: 5.0
    persist_steps: 3

  enemy_in_view:
    check_every: 2
    cooldown_steps: 4
    min_area_ratio: 0.002

policy:
  algo: "ppo"
  extractor: "custom"

  policy_kwargs:
    features_extractor_class: "framework.fast_extractors:StateImageExtractor"
    features_extractor_kwargs:
      features_dim: 384
      image_features_dim: 256
      state_features_dim: 128

    net_arch:
      pi: [256, 256, 256]
      vf: [256, 256, 256]

  learn_kwargs:
    n_steps: 2048
    batch_size: 4096
    n_epochs: 4
    target_kl: 0.03

    learning_rate_max: 3e-4
    learning_rate_min: 5e-5

    gamma: 0.99
    gae_lambda: 0.97
    clip_range: 0.2

    vf_coef: 0.6

    ent_coef_max: 0.05
    ent_coef_min: 0.002

    use_pinned_rollout_buffer: false
    use_cuda_optimized_ppo: true
    use_amp: true
    use_torch_compile: false
    use_cudnn_benchmark: true
    use_tf32: true

model_dir: "agents/deathmatch"
model_name: "joel_model.zip"

train: true
train_steps: 1100000
